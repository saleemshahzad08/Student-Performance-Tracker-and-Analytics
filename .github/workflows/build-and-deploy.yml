name: Build Android APK & Deploy GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build-and-deploy"
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. BUILD STANDALONE OFFLINE ANDROID APK
  # -------------------------------------------------------------
  build-apk:
    name: Build Offline Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Latest Web App Files to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/assets
          cp index.html android/app/src/main/assets/
          cp -r assets/* android/app/src/main/assets/assets/
          ls -la android/app/src/main/assets/assets/

      - name: Generate Gradle Wrapper if Missing
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5 || true
          fi

      - name: Build Android APK
        working-directory: android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease \
              -Pandroid.useAndroidX=true \
              -Pandroid.enableJetifier=true \
              --no-daemon \
              --console=plain \
              --stacktrace \
              --info
          else
            gradle :app:assembleRelease \
              -Pandroid.useAndroidX=true \
              -Pandroid.enableJetifier=true \
              --no-daemon \
              --console=plain \
              --stacktrace \
              --info
          fi

          mkdir -p ../dist-apk
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../dist-apk/student-tracker.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../dist-apk/student-tracker.apk \;
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentTracker-Android-APK
          path: dist-apk/*.apk
          retention-days: 30

  # -------------------------------------------------------------
  # 2. DEPLOY STATIC WEB APP TO GITHUB PAGES
  # -------------------------------------------------------------
  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build-apk
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare Pages Content
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp -r assets/* _site/assets/
          if [ -f sample_students.csv ]; then cp sample_students.csv _site/; fi
          touch _site/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
